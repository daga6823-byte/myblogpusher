<!--
	投稿エラー記事確認画面

	ArticleWork.status = 2 の記事について、
	記事タイトルと投稿エラー原因を一覧表示する。
-->

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>投稿エラー確認</title>

	<!-- 共通CSS -->
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/error.css}">
</head>

<body>

	<!-- 共通ヘッダー -->
	<div th:replace="~{fragments/header :: header}"></div>

	<div class="box">

		<h1>投稿エラー確認</h1>

		<div th:if="${#lists.isEmpty(errorWorks)}">
			<p>投稿エラーの記事はありません。</p>
		</div>

		<table th:unless="${#lists.isEmpty(errorWorks)}" class="error-list">

			<thead>
				<tr>
					<th>記事タイトル</th>
					<th>エラー原因</th>
					<th>操作</th>
				</tr>
			</thead>

			<tbody>

				<tr th:each="work : ${errorWorks}">

					<td th:text="${work.title}">
						記事タイトル
					</td>

					<td>
						<div class="error-message" th:text="${work.errorMessage}">
							エラー内容
						</div>
					</td>

					<td>
						<a th:href="@{/article/edit(workId=${work.workId})}">
							<button type="button" class="btn-edit">
								修正
							</button>
						</a>
					</td>

				</tr>

			</tbody>

		</table>

		<div class="button-area">

			<button type="button" id="backButton" class="btn-back">
				戻る
			</button>

		</div>

	</div>

	<script th:src="@{/js/common.js}"></script>

</body>

</html>
