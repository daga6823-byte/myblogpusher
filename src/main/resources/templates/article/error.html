<!--
	投稿エラー記事確認画面

	ArticleWork.status = 2 の記事について、
	記事タイトルと投稿エラー原因を表示する。
-->

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>投稿エラー確認</title>

	<!-- 共通CSS -->
	<link rel="stylesheet" th:href="@{/css/common.css}">
</head>

<body>

	<div class="container">

		<h1>投稿エラー確認</h1>

		<div th:if="${#lists.isEmpty(errorWorks)}">
			<p>投稿エラーの記事はありません。</p>
		</div>

		<div th:unless="${#lists.isEmpty(errorWorks)}">

			<div th:each="work : ${errorWorks}">

				<h2 th:text="${work.title}">記事タイトル</h2>

				<p>
					<strong>エラー原因</strong>
				</p>

				<p th:text="${work.errorMessage}">
					エラー内容
				</p>

				<!-- 既存の編集画面へ戻って記事を修正する -->
				<a th:href="@{/article/edit(workId=${work.workId})}">
					<button type="button">修正</button>
				</a>

				<hr>

			</div>

		</div>

		<!-- 既存画面と同じ戻る・ログアウト導線 -->
		<div class="button-area">

			<button type="button" id="backButton">
				戻る
			</button>

			<form th:action="@{/logout}" method="post">
				<button type="submit">
					ログアウト
				</button>
			</form>

		</div>

	</div>

	<script th:src="@{/js/common.js}"></script>

</body>

</html>
