<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>英単語辞書</title>
	<link rel="stylesheet" th:href="@{/css/common.css}">
</head>

<body>
	<div th:replace="~{fragments/header :: header}"></div>
	<div class="box">
		<h1>英単語辞書</h1>

		<p th:if="${param.saved}" class="success-message">保存しました。</p>

		<div class="button-row">
			<button type="button" id="addDictionaryButton" class="btn-correct">
				新規登録
			</button>
		</div>

		<table>
			<thead>
				<tr>
					<th>
						<button type="button" class="sort-button" data-sort="japanese">
							日本語
						</button>
					</th>

					<th>
						<button type="button" class="sort-button" data-sort="english">
							英単語
						</button>
					</th>

					<th>操作</th>
				</tr>
			</thead>
			<tbody id="englishDictionaryList">
				<tr th:each="dict : ${dictionaries}">
					<td th:text="${dict.japanese}"></td>
					<td th:text="${dict.english}"></td>
					<td class="list-actions">
						<button type="button" class="btn-correct btn-update" th:data-id="${dict.id}"
							th:data-japanese="${dict.japanese}" th:data-english="${dict.english}">
							編集
						</button>
						<form th:action="@{/english-dictionary/delete}" method="post" style="display: inline;">
							<input type="hidden" name="id" th:value="${dict.id}">
							<button type="submit" class="btn-delete"
								onclick="return confirm('削除してもよろしいですか？');">削除</button>
						</form>
					</td>
				</tr>
			</tbody>
		</table>
	</div>

	<button type="button" id="backButton" class="btn-back">戻る</button>

	<div th:replace="~{fragments/english_dictionary_modal :: englishDictionaryModal}"></div>

	<script th:src="@{/js/english_dictionary_list.js}"></script>
	<script th:src="@{/js/english_dictionary_modal.js}"></script>
	<script th:src="@{/js/common.js}"></script>

</body>

</html>
