<!--
	共通ヘッダー

	・左側にMBPロゴを表示
	・MBPの背景にMaterial Symbolsのアイコンを表示
	・右側にログインユーザー名とログアウトボタンを表示
-->

<th:block th:fragment="header">

	<!-- 共通ヘッダー用CSS -->
	<link rel="stylesheet" th:href="@{/css/header.css}">

	<!-- Material Symbols -->
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">

	<header class="common-header">

		<div class="header-logo">
			<span class="material-symbols-outlined header-logo-icon" aria-hidden="true">auto_stories</span>
			<a th:href="@{/home}" class="header-logo-text">MBP</a>
		</div>

		<div class="header-user">

			<span class="header-user-name" th:text="${session.loginUser.userName}">
				ユーザー名
			</span>

			<form th:action="@{/logout}" method="post">
				<button type="submit" class="header-logout">
					ログアウト
				</button>
			</form>

		</div>

	</header>

</th:block>
