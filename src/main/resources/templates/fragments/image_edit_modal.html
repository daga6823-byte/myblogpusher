<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<body>
	<!--
	画像編集モーダル
	・画像名変更
	・保存先フォルダ変更
	・画像ファイル差し替え
	-->
	<div th:fragment="imageEditModal" id="imageEditModal" class="modal-overlay">
		<div class="modal-content">

			<h2>画像編集</h2>

			<input type="hidden" id="imageId">

			<label>画像名</label>
			<input type="text" id="imageFileName">

			<label>保存先フォルダ</label>
			<input type="text" id="imageFolderName">

			<label>画像ファイル</label>
			<input type="file" id="imageFile" accept="image/*">

			<div class="modal-buttons">
				<button type="button" id="saveImageButton" class="btn-save">
					保存
				</button>
				<button type="button" id="cancelImageButton" class="btn-back">
					キャンセル
				</button>
			</div>
		</div>
	</div>

	<div style="margin-top:20px;">
		<button type="button" id="saveImageButton" class="btn-save">
			保存
		</button>
		<button type="button" id="cancelImageButton" class="btn-back">
			キャンセル
		</button>
	</div>

	</div>
	</div>

</body>

</html>
