<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

	<!--
		画像選択モーダル

		・画像一覧表示
		・画像アップロード
		・画像幅指定
		・Markdown挿入
	-->
	<div th:fragment="imageModal" id="imageModal"
		style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">

		<div
			style="background: #fff; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 20px; border-radius: 8px; width: 80%; max-height: 80%; overflow-y: auto;">

			<h2>画像選択</h2>


			<!-- 画像アップロードエリア -->
			<div style="border: 1px solid #ddd; padding: 12px; border-radius: 4px; margin-bottom: 16px;">

				<label for="imageFolderName">
					保存先フォルダ
				</label>

				<select id="imageFolderSelect">
					<option value="">選択してください</option>

					<option th:each="folder : ${imageFolders}" th:value="${folder}" th:text="${folder}">
					</option>

					<option value="__new__">
						＋ 新しいフォルダを追加
					</option>
				</select>

				<input type="text" id="newImageFolderName" placeholder="新しいフォルダ名を入力" style="display:none;">


				<label for="imageFileInput">
					画像ファイル
				</label>

				<input type="file" id="imageFileInput" accept="image/*">


				<button type="button" id="imageUploadButton" class="btn-back">
					アップロード
				</button>


				<span id="imageUploadStatus" style="margin-left:8px; font-size:13px;">
				</span>

			</div>


			<!-- 画像カテゴリー選択 -->
			<div style="margin-bottom: 8px;">

				<label>
					カテゴリー

					<select id="imageCategorySelect">

						<option value="">
							すべて
						</option>

						<option th:each="category : ${imageCategories}" th:value="${category.folderName}"
							th:text="${category.folderName}">
						</option>

					</select>

				</label>

			</div>


			<!-- 挿入画像サイズ指定 -->
			<div style="margin-bottom: 12px;">

				<label>
					画像幅(px)
					<input type="number" id="imageWidth" value="300" min="50" max="1000">
				</label>

			</div>


			<!--
				画像一覧

				JS側で
				・サムネイル
				・画像名
				を生成する
			-->
			<div id="imageList"
				style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px;">

			</div>

			<div id="imagePager" style="text-align:center; margin-top:15px;">

				<button type="button" id="imagePrevButton" class="btn-back">
					戻る
				</button>

				<span id="imagePageInfo">
					1 / 1
				</span>

				<button type="button" id="imageNextButton" class="btn-back">
					次へ
				</button>

			</div>


			<button type="button" onclick="document.getElementById('imageModal').style.display='none';"
				class="btn-back">

				キャンセル

			</button>

		</div>

	</div>

</body>

</html>
