<!DOCTYPE html>
<!-- インデックスのワークテーブル一覧画面 -->
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>インデックス一覧</title>

	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/article/article_list.css}">
</head>

<body>

	<div th:replace="~{fragments/header :: header}"></div>

	<div class="box">

		<h1>インデックス一覧</h1>

		<p th:if="${message}" th:text="${message}"></p>
		<p th:if="${error}" th:text="${error}"></p>

		<p th:if="${#lists.isEmpty(indexWorks)}">
			インデックスが登録されていません。
		</p>

		<table th:unless="${#lists.isEmpty(indexWorks)}">

			<thead>
				<tr>
					<th>タイトル</th>
					<th>カテゴリー階層</th>
					<th>更新日時</th>
					<th>状態</th>
					<th>操作</th>
				</tr>
			</thead>

			<tbody>

				<tr th:each="work : ${indexWorks}" th:with="categoryPath=${categoryPaths.?[groupId == #vars.work.groupId].size() > 0
                        ? categoryPaths.?[groupId == #vars.work.groupId][0].categoryPath
                        : '（カテゴリー不明）'}">

					<td th:text="${work.title}"></td>

					<td th:text="${categoryPath}"></td>

					<td class="local-date" th:attr="data-date=${work.updateDate}"></td>

					<td>
						<span th:if="${work.status == 0}">下書き</span>
						<span th:if="${work.status == 1}">反映中</span>
						<span th:if="${work.status == 2}">エラー</span>
					</td>

					<td class="list-actions">

						<form th:action="@{/index/edit/load}" method="post" style="display: inline;">

							<input type="hidden" name="groupId" th:value="${work.groupId}">

							<button type="submit" class="btn-edit">
								編集
							</button>

						</form>

					</td>

				</tr>

			</tbody>

		</table>

		<button type="button" id="backButton" class="btn-back">
			戻る
		</button>

	</div>

	<script th:src="@{/js/index/index_list.js}"></script>
	<script th:src="@{/js/common.js}"></script>

</body>

</html>
