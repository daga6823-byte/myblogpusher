<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>インデックス一覧</title>
</head>

<body>
	<main>
		<h1>インデックス一覧</h1>

		<p th:if="${message}" th:text="${message}"></p>
		<p th:if="${error}" th:text="${error}"></p>

		<p th:if="${#lists.isEmpty(indexes)}">
			インデックスが登録されていません。
		</p>

		<table th:unless="${#lists.isEmpty(indexes)}">
			<thead>
				<tr>
					<th>カテゴリー階層</th>
					<th>タイトル</th>
					<th>更新日時</th>
					<th>操作</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="index : ${indexes}">
					<td th:text="${categoryPaths.?[groupId == #vars.index.groupId].size() > 0
                        ? categoryPaths.?[groupId == #vars.index.groupId][0].categoryPath
                        : '（カテゴリー不明）'}"></td>
					<td th:text="${index.title}"></td>
					<td th:text="${index.updateDate}"></td>
					<td>
						<form th:action="@{/index/edit/load}" method="post">
							<input type="hidden" name="groupId" th:value="${index.groupId}">
							<button type="submit">編集</button>
						</form>
					</td>
				</tr>
			</tbody>
		</table>

		<p>
			<a th:href="@{/}">トップへ戻る</a>
		</p>
	</main>
</body>

</html>
