<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>テンプレート編集</title>
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/template_edit.css}">

	<!-- テンプレート編集画面の操作処理 -->
	<script type="module" th:src="@{/js/facade/template_facade.js}"></script>
</head>

<body>

	<div th:replace="~{fragments/header :: header}"></div>

	<main class="template-editor">

		<!-- 画面タイトル -->
		<div class="template-editor-header">
			<h1>テンプレート編集</h1>
			<a th:href="@{/template/list}">一覧へ戻る</a>
		</div>

		<!-- テンプレート基本情報 -->
		<form id="templateForm" th:action="@{/template/save}" th:object="${template}" method="post">

			<input type="hidden" name="_csrf" th:value="${_csrf}">

			<input type="hidden" th:field="*{templateId}">

			<div class="template-basic-info">

				<div class="form-group">
					<label for="templateName">テンプレート名</label>
					<input type="text" id="templateName" th:field="*{templateName}" maxlength="255" required>
				</div>

				<div class="form-group">
					<label for="templateKey">テンプレート識別キー</label>
					<input type="text" id="templateKey" th:field="*{templateKey}" maxlength="100" required>
				</div>

				<div class="form-group">
					<label for="templateDescription">説明</label>
					<textarea id="templateDescription" th:field="*{templateDescription}"></textarea>
				</div>

				<div class="form-group">
					<label for="backgroundColor">全体背景色</label>
					<input type="color" id="backgroundColor" name="backgroundColor" th:value="${template.backgroundColor != null
								? template.backgroundColor : '#FFFFFF'}">
				</div>

			</div>

			<div class="template-editor-toolbar">

				<!-- 行・列操作 -->
				<div class="toolbar-group">
					<button type="button" id="addRowButton">行を追加</button>
					<button type="button" id="deleteRowButton">選択行を削除</button>
					<button type="button" id="addColumnButton">列を追加</button>
					<button type="button" id="deleteColumnButton">選択列を削除</button>
				</div>

				<!-- セル追加 -->
				<div class="toolbar-group">
					<button type="button" id="addTextCellButton">テキストセル</button>
					<button type="button" id="addVariableCellButton">変数セル</button>
					<button type="button" id="addEmptyCellButton">空白セル</button>
					<button type="button" id="addImageCellButton">画像セル</button>
				</div>

				<!-- セル結合 -->
				<div class="toolbar-group">
					<button type="button" id="mergeCellsButton">セルを結合</button>
					<button type="button" id="splitCellButton">結合を解除</button>
				</div>

				<!-- 文字装飾 -->
				<div class="toolbar-group">
					<label for="cellTextColor">文字色</label>
					<input type="color" id="cellTextColor" value="#000000">
					<input type="text" id="cellTextColorCode" value="#000000" maxlength="7" pattern="#[0-9A-Fa-f]{6}"
						placeholder="#000000" title="カラーコード（例：#000000）">

					<label for="cellTextStrokeColor">文字の縁取り色</label>
					<input type="color" id="cellTextStrokeColor" value="#000000">
					<input type="text" id="cellTextStrokeColorCode" value="#000000" maxlength="7"
						pattern="#[0-9A-Fa-f]{6}" placeholder="#000000" title="縁取り色（例：#000000）">

					<label for="cellTextStrokeWidth">縁取りの太さ</label>
					<input type="number" id="cellTextStrokeWidth" min="0" max="3" step="0.5" value="0">
					<span>px</span>

					<label for="cellFontSize">文字サイズ</label>
					<select id="cellFontSize">
						<option value="12">12px</option>
						<option value="14">14px</option>
						<option value="16" selected>16px</option>
						<option value="18">18px</option>
						<option value="20">20px</option>
						<option value="24">24px</option>
						<option value="28">28px</option>
						<option value="32">32px</option>
						<option value="36">36px</option>
						<option value="48">48px</option>
					</select>

					<label for="cellFontWeight">文字の太さ</label>
					<select id="cellFontWeight">
						<option value="normal">標準</option>
						<option value="bold">太字</option>
					</select>

					<label for="cellTextAlign">文字配置</label>
					<select id="cellTextAlign">
						<option value="left">左揃え</option>
						<option value="center">中央揃え</option>
						<option value="right">右揃え</option>
					</select>
				</div>

				<!-- セル背景色 -->
				<div class="toolbar-group">
					<label for="cellBackgroundColor">セル背景色</label>
					<input type="color" id="cellBackgroundColor" value="#FFFFFF">
					<input type="text" id="cellBackgroundColorCode" value="#FFFFFF" maxlength="7"
						pattern="#[0-9A-Fa-f]{6}" placeholder="#FFFFFF" title="カラーコード（例：#FFFFFF）">
				</div>

				<!-- 使用色履歴 -->
				<div class="toolbar-group">
					<label>使用した色</label>
					<div id="templateColorHistory" class="template-color-history"></div>
				</div>

				<!-- 使用色履歴 -->
				<div class="toolbar-group">
					<label>使用した色</label>
					<div id="templateColorHistory" class="template-color-history"></div>
				</div>

			</div>

			<!-- レイアウト編集領域 -->
			<section class="template-layout-editor">
				<h2>レイアウト</h2>

				<div id="templateGrid" class="template-grid" th:style="'background-color: '
		+ (${template.backgroundColor != null
			? template.backgroundColor : '#FFFFFF'})" th:data-rows="${rowsJson}" th:data-columns="${columnsJson}"
					th:data-cells="${cellsJson}">

					<p th:if="${#lists.isEmpty(rows) and #lists.isEmpty(columns)}">
						まだレイアウトがありません。行・列を追加してください。
					</p>

					<!-- 既存の画像選択モーダル -->
					<div th:replace="~{fragments/image_modal :: imageModal}"></div>
			</section>

			<div class="template-editor-footer">
				<button type="submit">テンプレート情報を保存</button>
			</div>

		</form>

	</main>

</body>

</html>
